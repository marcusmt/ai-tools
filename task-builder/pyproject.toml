[project]
name = "task-builder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "httpx",
    "pydantic>=2",
]

[project.scripts]
task-builder = "jira_triage.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["jira_triage"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
